security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto
  providers:
    app_user_provider:
      entity:
        class: App\Security\Domain\Entity\User
        property: username
  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false
    main:
      lazy: true
      provider: app_user_provider
  access_control:
    - { path: ^/api/admin/leave, roles: ROLE_HR_ADMIN }
    - { path: ^/api/leave, roles: ROLE_USER }
