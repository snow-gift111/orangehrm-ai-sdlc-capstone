spring:
  application:
    name: leave-balance-alert
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orangehrm}
    username: ${DB_USERNAME:orangehrm}
    password: ${DB_PASSWORD:orangehrm}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8080/realms/orangehrm}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

leave-balance-alert:
  scheduler:
    enabled: ${LEAVE_ALERT_SCHEDULER_ENABLED:false}
    cron: ${LEAVE_ALERT_SCHEDULER_CRON:0 0 1 * * *}
  integration:
    balance-query: >
      ${LEAVE_ALERT_BALANCE_QUERY:select employee_id, employee_user_id, employee_display_name, leave_type_id, leave_type_name, balance
      from v_leave_balance_alert_balances
      where leave_type_id in (:leaveTypeIds)}
    manager-query: >
      ${LEAVE_ALERT_MANAGER_QUERY:select manager_user_id
      from v_leave_balance_alert_managers
      where employee_id = :employeeId}
    hr-users-query: >
      ${LEAVE_ALERT_HR_USERS_QUERY:select user_id
      from v_leave_balance_alert_hr_users}