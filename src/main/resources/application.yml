server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: leave-balance-alert
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/orangehrm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:orangehrm}
    password: ${DB_PASSWORD:orangehrm}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

leave-alert:
  scheduler:
    enabled: ${LEAVE_ALERT_SCHEDULER_ENABLED:true}
    cron: ${LEAVE_ALERT_SCHEDULER_CRON:0 0 2 * * *}
    zone: ${LEAVE_ALERT_SCHEDULER_ZONE:UTC}
    period-key: ${LEAVE_ALERT_PERIOD_KEY:#{T(java.time.Year).now().toString()}}
  security:
    header-auth-enabled: ${LEAVE_ALERT_HEADER_AUTH_ENABLED:true}
  recipients:
    hr-user-ids: ${LEAVE_ALERT_HR_USER_IDS:}
    manager-user-by-employee-id: ${LEAVE_ALERT_MANAGER_USER_BY_EMPLOYEE_ID:}