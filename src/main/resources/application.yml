server:
  port: 8080

spring:
  application:
    name: leave-balance-alert
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orangehrm}
    username: ${DB_USERNAME:orangehrm}
    password: ${DB_PASSWORD:orangehrm}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

app:
  security:
    # Comma-separated role names expected in Authentication authorities
    hrAdminRole: ${HR_ADMIN_ROLE:HR_ADMIN}
    # Comma-separated roles allowed to view admin alert history (in addition to HR admin)
    hrHistoryViewerRoles: ${HR_HISTORY_VIEWER_ROLES:HR}

  leaveBalanceAlert:
    evaluationCron: ${LAB_EVALUATION_CRON:0 0 2 * * *} # daily at 02:00
    employeeBatchSize: ${LAB_EMPLOYEE_BATCH_SIZE:500}

logging:
  level:
    root: INFO
    com.orangehrm.leavealert: INFO
