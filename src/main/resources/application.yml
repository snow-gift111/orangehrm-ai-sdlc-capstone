server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: orangehrm
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orangehrm}
    username: ${DB_USERNAME:orangehrm}
    password: ${DB_PASSWORD:orangehrm}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.orangehrm: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
